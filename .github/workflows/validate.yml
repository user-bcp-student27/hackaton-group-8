name: Validate wallet MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wallet:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore frontend
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Build app and test backend
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Test desktop and mobile
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm test
      - name: Verify crash recovery
        shell: pwsh
        run: .\scripts\test-persistence.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-test-evidence
          path: |
            backend/target/surefire-reports/
            frontend/playwright-report/
          retention-days: 7
