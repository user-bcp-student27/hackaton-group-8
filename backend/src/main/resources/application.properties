quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=2M
quarkus.jackson.fail-on-unknown-properties=true
wallet.db.url=${WALLET_DB_URL:jdbc:h2:file:./data/wallet;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
%test.wallet.db.url=jdbc:h2:mem:wallet-test;DB_CLOSE_DELAY=-1
quarkus.log.category."pe.wallet".level=INFO
